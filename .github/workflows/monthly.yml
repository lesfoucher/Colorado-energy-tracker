name: Monthly update

on:
  schedule:
    # The EIA publishes each month's data late in the following months; checking on the 28th picks it up.
    - cron: "0 15 28 * *"
  push:
    branches: [main]
  workflow_dispatch:  # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/test_pipeline.py tests/test_summarize.py

      - name: Fetch, check, and load the data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m pipeline.run

      - name: Spot-check the real data
        run: pytest tests/test_real_data.py

      - name: Export the dashboard data
        run: python -m pipeline.export

      - name: Write the AI summary (skipped if there is no API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.summarize

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
